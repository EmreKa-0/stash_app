name: stash
description: A modern baggage storage application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- UI & DESIGN ---
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  lottie: ^3.1.2
  flutter_rating_bar: ^4.0.1
  

  # --- MAPS & LOCATION ---
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  url_launcher: ^6.2.5
  permission_handler: ^11.3.0

  # --- FIREBASE & AUTH ---
  firebase_core: ^2.27.1
  firebase_app_check: ^0.2.1+1
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.5
  google_sign_in: ^6.2.1

  # --- UTILITIES ---
  intl: ^0.19.0
  http: ^1.1.0  # ✅ BURAYA TAŞINDI
  dio: ^5.9.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/logo.png"
  adaptive_icon_background: "#C7EBFD"
  adaptive_icon_foreground: "assets/icons/logo.png"
  web:
    generate: true
    image_path: "assets/icons/logo.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/lottie/
    - assets/icons/
    - assets/locations/tr_locations.json
